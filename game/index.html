<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>招き猫ゲーム - Beta</title>
<style>
body{margin:0;background:#f7f5f0;color:#333;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}
main{max-width:900px;margin:auto;padding:24px}
.panel{background:#fff;border:1px solid #e5dfd2;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #0000000b}
h1{text-align:center}.sub{text-align:center;color:#666}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;background:#fbfaf6;padding:12px;border-radius:10px}
.num{font-size:28px;font-weight:700}
.actions{text-align:center}
button{font-size:18px;padding:12px 22px;margin:5px;border:0;border-radius:9px;cursor:pointer;background:#e74c3c;color:white;font-weight:700}
button:disabled{background:#aaa;cursor:not-allowed}
#cats{display:flex;flex-wrap:wrap;gap:8px;min-height:90px}
.cat{width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:34px}.cat-image{width:72px;height:72px;object-fit:contain}.dice-animation{display:flex;justify-content:center;align-items:center;min-height:80px}.dice-video{max-width:260px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}.event-modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.event-modal.visible{display:flex}.mogumogu-panel{margin-top:12px;padding:12px;border:1px dashed #d9c8a8;border-radius:10px;background:#fffaf0}.mogumogu-panel button{margin-top:8px}.event-modal-content{background:#fff;border-radius:16px;padding:24px;max-width:520px;width:min(520px,92vw);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}.event-image{max-width:180px;max-height:180px;object-fit:contain}.event-modal-content button{margin-top:10px}.dice-visual{display:flex;gap:10px;justify-content:center;align-items:center;min-height:80px;margin:10px 0}.dice-image{object-fit:contain}.dice-fallback{font-size:28px}
#log{height:220px;overflow:auto;background:#fafafa;border:1px solid #ddd;padding:10px;font:13px monospace}
.notice{font-size:14px;color:#666}.logo{text-align:center;margin-bottom:4px}.logo img{max-width:260px;max-height:90px;object-fit:contain}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="logo"><img id="logoImage" alt="招き猫ゲーム"></div><h1>🐾 招き猫ゲーム</h1>
<div class="sub">アリス研究所 ― 「面白い、を数学に。」</div>

<section class="panel">
<div class="stats">
<div class="stat">ターン<div id="turn" class="num">1</div></div>
<div class="stat">招き猫<div id="count" class="num">0</div></div>
<div class="stat">次のサイコロ<div id="dice" class="num">1</div></div>
</div>
<div id="eventStatus" class="notice">イベント: idle / -</div>
</section>

<section class="panel actions">
<h2>🎲 アクション</h2>
<div id="result">まだ振っていません</div><div id="diceAnimation" class="dice-animation" hidden></div><div id="diceVisual" class="dice-visual"></div>
<button id="roll">サイコロを振る</button>
<button id="dropout">ドロップアウト</button>
<button id="reset">リセット</button><div id="mogumoguPanel" class="mogumogu-panel"><div><strong>🍬 研究チャレンジ</strong></div><div id="mogumoguResult">もぐもぐチャレンジ</div><div id="mogumoguDice"></div><div id="mogumoguReward"></div><button type="button">もぐもぐチャレンジを試す</button></div>
</section>

<div id="eventModal" class="event-modal" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
  <div class="event-modal-content">
    <img id="eventModalImage" class="event-image" alt="チェシャ猫">
    <h2 id="eventTitle">🐈 イベント</h2>
    <p id="eventMessage"></p>
    <button id="eventClose">閉じる</button>
  </div>
</div>

<section class="panel">
<h2>🐱 招き猫フィールド</h2>
<div id="cats"></div>
</section>

<section class="panel">
<h2>📜 ログ</h2>
<div id="log"></div>
</section>

<section class="panel notice">
<strong>Beta公開版</strong><br>
クラシックモードを中心に、基本ターン処理・招き猫生成・チェシャ猫イベント・ドロップアウトを統合しています。
</section>

<script type="module">
import { createMain } from "../src/main/Main.js";
const app = createMain(document);
app.controller.start();
</script>
</main>
</body>
</html>
