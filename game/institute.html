<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ea">
  <title>アリス研究所 - 招き猫ゲーム</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26344a;
      --muted: #667085;
      --line: #e5dfd4;
      --paper: rgba(255,255,255,.94);
      --blue: #5870a8;
      --blue-dark: #435889;
      --blue-soft: #eef2f9;
      --gold: #c99b4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(255,255,255,.9), transparent 26%),
        radial-gradient(circle at 92% 18%, rgba(225,232,246,.75), transparent 25%),
        linear-gradient(180deg, #faf7f0 0%, #f7f3ea 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.7;
    }
    main { width: min(1080px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 50px; }
    .institute-header { text-align: center; margin-bottom: 24px; }
    .institute-eyebrow { color: var(--muted); font-size: .82rem; letter-spacing: .16em; }
    h1 { margin: 4px 0 2px; font-family: Georgia, "Yu Mincho", serif; font-size: clamp(2rem, 6vw, 3.3rem); letter-spacing: .04em; }
    .muted { color: var(--muted); }
    .institute-header-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .institute-link { color: var(--blue-dark); font-weight: 700; text-decoration: none; border-bottom: 1px solid #cbd4e4; }
    .institute-link:hover { color: var(--blue); }
    .institute-panel, .institute-facility-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 8px 26px rgba(55,48,38,.06);
    }
    .institute-panel { padding: 22px; margin: 0 0 18px; }
    .institute-panel h3 { margin: 0 0 6px; font-size: 1.25rem; }
    .institute-panel > p { margin: 0 0 14px; }
    .institute-notice { margin: 0 0 16px; padding: 12px 15px; border: 1px solid #d9e0ee; border-radius: 12px; background: var(--blue-soft); color: #405477; }
    .institute-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
    .institute-summary-item { display: flex; flex-direction: column; align-items: center; padding: 10px; border-radius: 12px; background: #fbfaf6; }
    .institute-summary-item strong { font-size: 1.5rem; }
    .institute-facility-group { margin-top: 26px; }
    .institute-facility-group h2 { margin: 0 0 12px; font-size: 1.15rem; }
    .institute-facility-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .institute-facility-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      min-height: 160px; padding: 18px; color: var(--ink); text-align: left; cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .institute-facility-card:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(55,48,38,.1); }
    .institute-facility-card:disabled { opacity: .55; cursor: not-allowed; }
    .facility-card-title { font-size: 1.14rem; font-weight: 800; }
    .facility-card-description { color: var(--muted); font-size: .92rem; }
    .facility-card-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; }
    .facility-status, .facility-level { display: inline-block; padding: 2px 9px; border-radius: 999px; background: #f1f0ec; color: #5f6570; font-size: .77rem; font-weight: 700; }
    .facility-level { background: #f7f0df; color: #806536; }
    .institute-facility-nav { margin-bottom: 15px; }
    .institute-button {
      padding: 9px 15px; border: 1px solid #cbd4e4; border-radius: 999px;
      background: #fff; color: var(--blue-dark); font: inherit; font-weight: 700; cursor: pointer;
    }
    .institute-button:hover:not(:disabled) { background: var(--blue-soft); }
    .institute-button:disabled { opacity: .5; cursor: not-allowed; }
    .institute-placeholder { padding: 14px 16px; border: 1px dashed #d8d4cc; border-radius: 12px; background: #fcfbf8; color: var(--muted); }
    .institute-content-stack { display: grid; gap: 16px; }
    .institute-list-item { display: grid; gap: 5px; padding: 13px 0; border-top: 1px solid #eee9e0; }
    .institute-list-item:first-of-type { border-top: 0; }
    .institute-list-item p { margin: 0; }
    .institute-chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .institute-chip { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
    .ari-statistics-table { width: 100%; border-collapse: collapse; background: #fff; font-size: .9rem; }
    .ari-statistics-table th, .ari-statistics-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    .ari-statistics-table th:first-child, .ari-statistics-table td:first-child { text-align: center; }
    .ari-statistics-table thead { background: #f7f5ef; }
    .ari-statistics-table th { color: var(--blue-dark); font-weight: 800; }
    @media (max-width: 700px) {
      .ari-statistics-table { font-size: .78rem; }
      .ari-statistics-table th, .ari-statistics-table td { padding: 7px 5px; }
    }
    .institute-character-grid, .institute-feature-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
    .institute-feature-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .institute-character-card { padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .institute-character-card p { margin: 4px 0 0; font-size: .9rem; }
    .character-mark { margin-bottom: 6px; font-size: 2rem; }
    footer { margin-top: 28px; color: var(--muted); text-align: center; font-size: .82rem; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .institute-facility-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .institute-character-grid { grid-template-columns: 1fr; }
      .institute-feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      main { width: calc(100% - 20px); padding-top: 18px; }
      .institute-panel { padding: 16px; }
      .institute-facility-grid { grid-template-columns: 1fr; }
      .institute-facility-card { min-height: 125px; }
      .institute-summary { gap: 6px; }
      .institute-summary-item strong { font-size: 1.25rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <div id="researchInstituteRoot"></div>
    <footer>アリス研究所　―　面白い、を数学に。</footer>
  </main>
  <script type="module">
    import { GameState } from "../src/core/GameState.js";
    import { SaveManager } from "../src/save/SaveManager.js";
    import { createResearchInstituteServices } from "../src/institute/createResearchInstituteServices.js";
    import { ResearchInstituteScreen } from "../src/ui/ResearchInstituteScreen.js";
    import {
      RESEARCH_INSTITUTE_ACHIEVEMENT_KEY,
      RESEARCH_THEME_DEFINITIONS,
      ResearchInstituteAchievementBridge
    } from "../src/institute/ResearchThemeDefinitions.js";
    import {
      RESEARCH_CHALLENGE_RESULT_PREFIX,
      RESEARCH_CHALLENGE_SESSION_PREFIX,
      ResearchChallengeBridge
    } from "../src/institute/ResearchChallengeBridge.js";

    const gameState = new GameState();
    const saveManager = new SaveManager(gameState);
    saveManager.load();

    const challengeBridge = new ResearchChallengeBridge();
    const challengeStarter = ({ themeId, challengeId }) => {
      const session = challengeBridge.createSession({ themeId, challengeId });
      if (!session) return false;

      const target = new URL("./index.html", window.location.href);
      target.searchParams.set("researchSession", session.sessionId);
      const challengeWindow = window.open(target.toString(), "_blank");
      if (!challengeWindow) {
        challengeBridge.cancelSession(session.sessionId);
        challengeBridge.consumeResult(session.sessionId);
        return false;
      }
      return true;
    };

    const services = createResearchInstituteServices({
      gameState,
      saveManager,
      themeDefinitions: RESEARCH_THEME_DEFINITIONS,
      challengeStarter,
      discoveryConditionEvaluator: (theme, event) =>
        theme.themeId === "maneki-neko-appearance-probability" &&
        event?.source === "game_achievement" &&
        event?.achievementId === "cat-count-20"
    });

    const achievementBridge = new ResearchInstituteAchievementBridge();

    const screen = new ResearchInstituteScreen({
      documentRef: document,
      root: document.querySelector("#researchInstituteRoot"),
      controller: services.instituteController,
      services
    });

    function importGameAchievements({ announce = false } = {}) {
      const achievements = achievementBridge.readAll();
      if (!achievements["cat-count-20"]) return false;

      const discovered = services.instituteController.handleInstituteEvent({
        eventId: "classic-cat-count-20",
        source: "game_achievement",
        sourceId: "cat-count-20",
        achievementId: "cat-count-20"
      });

      if (discovered.length > 0 && announce) {
        screen.notice = "招き猫20匹達成の実績を確認しました。研究テーマを発見しました！";
        screen.render();
      }
      return discovered.length > 0;
    }

    // Import achievements already earned before the institute page was opened.
    importGameAchievements();

    const restoreSession = challengeBridge.readActiveSession();
    if (restoreSession && ["active", "completed"].includes(restoreSession.status)) {
      services.challengeCoordinator.restoreActiveChallenge({
        themeId: restoreSession.themeId,
        challengeId: restoreSession.challengeId
      });
      if (restoreSession.status === "completed") {
        receiveChallengeResult(restoreSession.sessionId);
      }
    }

    function receiveChallengeResult(sessionId) {
      const result = challengeBridge.readResult(sessionId);
      if (!result) return false;

      const receipt = services.instituteController.receiveChallengeResult(result);
      if (receipt.accepted || receipt.duplicate) {
        challengeBridge.consumeResult(sessionId);
        screen.notice = receipt.accepted
          ? "実験結果を研究記録へ登録しました。"
          : "この実験結果は登録済みのため、重複登録を行いませんでした。";
        screen.render();
        return true;
      }

      screen.notice = "実験結果を受け取りましたが、登録できませんでした。研究テーマの状態を確認してください。";
      screen.render();
      return false;
    }

    window.addEventListener("storage", event => {
      if (typeof event.key !== "string") return;

      if (event.key === RESEARCH_INSTITUTE_ACHIEVEMENT_KEY) {
        importGameAchievements({ announce: true });
        return;
      }

      if (event.key.startsWith(RESEARCH_CHALLENGE_RESULT_PREFIX)) {
        const sessionId = event.key.slice(RESEARCH_CHALLENGE_RESULT_PREFIX.length);
        receiveChallengeResult(sessionId);
        return;
      }

      if (event.key.startsWith(RESEARCH_CHALLENGE_SESSION_PREFIX) && event.newValue) {
        try {
          const session = JSON.parse(event.newValue);
          if (session?.status === "cancelled") {
            services.challengeCoordinator.cancelChallenge();
            challengeBridge.consumeResult(session.sessionId);
            screen.notice = "実験が中断されたため、結果は登録されていません。実験室から再度開始できます。";
            screen.render();
          }
        } catch (_error) {
          // Ignore malformed cross-tab session messages.
        }
      }
    });
  </script>
</body>
</html>
