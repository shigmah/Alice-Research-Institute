<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>招き猫ゲーム - コレクター達成E2Eテスト</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Yu Gothic", sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    .panel {
      background: #fff;
      border: 1px solid #e5dfd2;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
    }

    h1, h2 {
      margin-top: 0;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    select {
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 8px;
    }

    button {
      border: 0;
      cursor: pointer;
      background: #ef4d3f;
      color: #fff;
      font-weight: 700;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #cats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 120px;
    }

    .cat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .cat-image {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    #log {
      min-height: 180px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid #ddd;
      padding: 10px;
      background: #fafafa;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      text-align: center;
      background: #fbfaf6;
      padding: 14px;
      border-radius: 10px;
    }

    .num {
      display: block;
      font-size: 28px;
      font-weight: 700;
      margin-top: 4px;
    }

    .game-over-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-over-modal.visible {
      display: flex;
    }

    .game-over-content {
      width: min(680px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 32px;
      text-align: center;
    }

    #gameOverTitle {
      margin-bottom: 12px;
    }

    #gameOverMessage {
      font-size: 18px;
    }

    #eventModal {
      display: none;
    }
  </style>
</head>

<body>
<main>

  <section class="panel">
    <h1>🧪 コレクター達成確認E2Eテスト</h1>
    <p>
      本番ゲームとは分離した、コレクターモード達成条件の実機確認ページです。
    </p>

    <div class="controls">
      <label>
        モード
        <select id="modeSelect">
          <option value="classic">クラシックモード</option>
          <option value="collector" selected>コレクターモード</option>
          <option value="alice">アリスモード</option>
          <option value="collector-alice">コレクター＋アリスモード</option>
        </select>
      </label>

      <label id="targetTurnsField" hidden>
        目標ターン
        <input
          id="targetTurnsInput"
          type="number"
          min="1"
          max="999"
          value="20"
        >
      </label>

      <button id="modeStart" type="button">
        モードを開始
      </button>

      <button id="prepareComplete" type="button">
        🏆 各色10匹を投入
      </button>

      <button id="reset" type="button">
        リセット
      </button>
    </div>

    <p id="modeDescription"></p>
  </section>

  <section class="panel">
    <h2>🎲 アクション</h2>

    <div id="result">まだ振っていません</div>

    <div id="diceAnimation" hidden></div>
    <div id="diceVisual"></div>

    <div class="controls">
      <button id="roll" type="button">サイコロを振る</button>
      <button id="dropout" type="button">ドロップアウト</button>
    </div>
  </section>

  <section class="panel">
    <h2>🐱 招き猫フィールド</h2>
    <div id="cats"></div>
  </section>

  <section class="panel">
    <h2>📊 ステータス</h2>

    <div class="stats">
      <div class="stat">
        ターン
        <span id="turn" class="num">1</span>
      </div>

      <div class="stat">
        招き猫
        <span id="count" class="num">0</span>
      </div>

      <div class="stat">
        次のサイコロ数
        <span id="dice" class="num">1</span>
      </div>
    </div>

    <div id="gameOverBanner" hidden></div>
  </section>

  <section class="panel">
    <h2>📜 ログ</h2>
    <div id="log"></div>
  </section>

  <!-- MainScreen / GameController が参照する要素 -->
  <div hidden>
    <img id="logoImage" alt="招き猫ゲーム">

    <div id="eventModal" class="event-modal">
      <img id="eventModalImage" alt="">
      <div id="eventTitle"></div>
      <div id="eventMessage"></div>
      <div id="eventModalDice" hidden></div>
      <button id="eventNext" type="button" hidden>次へ</button>
      <button id="eventClose" type="button">閉じる</button>
    </div>

    <div id="mogumoguPanel"></div>
    <div id="mogumoguResult"></div>
    <div id="mogumoguReward"></div>
    <div id="mogumoguDice"></div>
    <button id="mogumoguButton" type="button">アリスと挑戦する</button>

    <div id="gameOverModal" class="game-over-modal">
      <div class="game-over-content">
        <h2 id="gameOverTitle"></h2>
        <p id="gameOverMessage"></p>
        <p id="gameOverReason"></p>
        <button id="gameOverClose" type="button">閉じる</button>
      </div>
    </div>
  </div>

</main>

<script type="module">
  import { createMain } from "../src/main/Main.js";

  const app = createMain(document);

  // デバッグ確認用にアプリ本体を参照可能にする
  window.__collectorE2E = app;

  app.controller.start();

  document
    .querySelector("#prepareComplete")
    ?.addEventListener("click", () => {
      const { game } = app;

      // コレクターモードを初期化
      game.startCollectorMode();

      // 自動イベントを発生させず、達成条件だけを検証する
      game.eventManager.checkEvent = () => false;

      // 各色10匹を投入
      for (const color of ["white", "black", "gold"]) {
        for (let i = 0; i < 10; i += 1) {
          game.catManager.createCat({ color });
        }
      }

      /*
       * 2個のサイコロを「1,1」に固定。
       * 合計2は非素数なので猫は減らず、
       * 通常の Game.roll() を通して CollectorRule.checkResult()
       * の COLLECTOR_COMPLETE 判定へ到達する。
       */
      game.state.setCurrentDiceCount(3);

        const testRolls = [1, 1, 4];
        let testRollIndex = 0;

        game.randomManager.rollDice = () => testRolls[testRollIndex++];

      const outcome = game.roll();

      console.log("Collector completion E2E:", {
        result: outcome?.mode?.result,
        gameEndReason: game.state.gameEndReason,
        isGameOver: game.state.isGameOver,
        counts: game.collectorRule.getColorCounts()
      });
    });
</script>

</body>
</html>
