<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>招き猫ゲーム - Browser Self Test</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;background:#f7f5f0;color:#333;margin:0}
main{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e5dfd2;border-radius:14px;padding:20px;margin:14px 0}
.ok{color:#18794e}.ng{color:#b42318}.test{padding:8px 0;border-bottom:1px solid #eee}
button{padding:10px 16px;border:0;border-radius:8px;background:#e74c3c;color:#fff;font-weight:700}
</style>
</head>
<body>
<main>
<h1>🔬 招き猫ゲーム Browser Self Test</h1>
<section class="panel">
<button id="run">テスト実行</button>
<div id="summary"></div>
<div id="results"></div>
</section>
<script type="module">
import { Game } from "./src/core/Game.js";

const results = [];
function assert(name, condition, detail=""){
  results.push({name,ok:Boolean(condition),detail});
}

document.querySelector("#run").addEventListener("click",()=>{
  results.length=0;

  try{
    const game = new Game();

    assert("初期ターンは1", game.state.turn === 1);
    assert("初期猫数は0", game.state.getCats().length === 0);
    assert("初期サイコロ数は1", game.state.getCurrentDiceCount() === 1);

    const outcome = game.roll();

    assert("roll() が結果を返す", outcome !== null);
    assert("出目が1件", outcome?.result?.values?.length === 1);
    assert("フェーズ1後に猫が生成される", game.state.getCats().length >= 1);
    assert("ターンが1進む", game.state.turn === 2);
    assert("通常ターン後はゲーム継続", game.state.isGameOver === false);

    const before = game.state.getCats().length;
    const dropout = game.dropout();

    assert("ドロップアウト結果が返る", dropout !== null);
    assert("ドロップアウト時の確定猫数", game.state.fixedCatCount === before);
    assert("ドロップアウトで終了状態", game.state.isGameOver === true);

    game.reset();
    game.start();
    assert("reset後ターンは1", game.state.turn === 1);
    assert("reset後猫数は0", game.state.getCats().length === 0);
    assert("reset後ゲーム継続", game.state.isGameOver === false);
  }catch(error){
    assert("例外なく実行できる", false, error?.stack || String(error));
  }

  const passed = results.filter(x=>x.ok).length;
  const failed = results.length-passed;

  document.querySelector("#summary").innerHTML =
    `<p><strong>RESULT: ${failed===0?"PASS":"FAIL"}</strong> (${passed}/${results.length})</p>`;

  document.querySelector("#results").innerHTML = results.map(r =>
    `<div class="test ${r.ok?"ok":"ng"}">
      ${r.ok?"✅":"❌"} ${r.name}
      ${r.detail?`<div style="font-size:13px;margin-top:4px">${r.detail}</div>`:""}
    </div>`
  ).join("");
});
</script>
</main>
</body>
</html>
